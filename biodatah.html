<!DOCTYPE html>
<html lang="id">
<head>                                                                                                                               
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="biodata.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
        <h1 class="brand-title">SMK BAKTI NUSANTARA 666</h1><br>
        <nav class="main-nav">
            <a  href="#" align="center">Beranda</a> <br>
            <a  href="profil.html" align="center">Profil</a>  <br>
            <a  href="#" align="center">Biodata</a><br>
        </nav>
        </div>
    </header>
    <main class="main-content" align="center">
        <section class="form-section">
            <h1 align="center">FORM PENDAFTARAN SISWA</h1><br><br>
            
            <form action="proses.php" method="post" class="custom-form">
                <div class="form-grid">
            <div class="form-group">
            </div>
                
                <label for="nama">🎀Nama Lengkap:🎀</label>
                <input type="text" id="nama" name="nama" placeholder="Nama lengkap anda" required>
                </div>
              
                <div class="form-group">
                
                <label for="email">📩Email:</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>
                
                <div class="form-group">
                
                <label for="password">🔍Password:</label>
                <input type="password" id="password" name="password" placeholder="minimal 8 karakter"
                minlength="8" required>
                <small id="passwordWarning"></small>
                <label class="show-password">
                    <input type="checkbox"
                    id="showPassword">
                    Tampilkan Password
                </label>
                </div>
                
                <div class="form-group">
                   
                <label for="tanggal_lahir">📆Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir">
                </div>
               
                <div class="from-group">
                    
                <label for="no_HP">☎️NO HP:</label><br>
                <input type="tel" id="no_HP" name="no_HP" placeholder="08xxxxxxxx"
                inputmode="numeric" pattern="[0-9]{10-13}" maxlength="13" required>
                 </div>
                
                

                <div class="form-group">
                    <div class="gender">
                <p>👧🏻🧒🏻Jenis Kelamin:</p>
                <div class="gender-options">
                <label>
                    <input type="radio" name="gender" value="perempuan"> 👧🏻Perempuan
                    </label>
                    <label>
                        <input type="radio" name="gender" value="lakilaki"> 🧒🏻Laki=laki
                    </label>
                    </div>
                </div>
            </div>
                    
            <div class="form=group">
                    <label for="jurusan"> Jurusan🏫</label><br>
                  
                    <select id="jurusan" name="jurusan" required>
                        <option value ="">--Pilih Jurusan--</option>
                        <option value="dkv">🎨DKV</option>
                        <option value="akt">💸AKT</option>
                        <option value="pplg">🖥️PPLG</option>
                        <option value="anm">📽️ANIMASI</option>
                        <option value="bdp">🛍️PEMASARAN</option>
                    </select>
                </div>
                    
                  <div class="form=group">
                <label for="alamat">📍 Alamat</label><br>
<input type="text" id="alamat" name="alamat"
placeholder="Masukan alamat rumah kamu" required>
                  </div>
                
                
               <div class="form-group hobby-group">
    <label class="group-label">Hobi kamu ngapain aja nih?🤔❓</label>

    <div class="checkbox-group">
        <label class="inline-label">
            <input type="checkbox" name="hobi" value="melukis">
           🎨 Melukis
        </label>

        <label class="inline-label">
            <input type="checkbox" name="hobi" value="game">
           🎮 Game
        </label>

        <label class="inline-label">
            <input type="checkbox" name="hobi" value="membaca">
           📖 Membaca
        </label>
    </div>
</div>
</div>
            
                <div class="button-group">
                <button type="submit"
                 class="button">Kirim</button>
                <button type="reset"
                 class="button">Batal</button>
                </div>
            </form>
        </section>
    </main>

        <p align="center">&copy; 2026 SMK BAKTI NUSANTARA 666, All Rights Revesed</p>
    </footer>

</body>
</html>
